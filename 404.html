<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไม่พบหน้าที่ต้องการ | Staff QR Hub</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f5f7fa">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">

    <!--
        หน้า 404 ตั้งใจเขียน style ไว้ในไฟล์เดียวแบบสั้น ๆ
        เพราะ GitHub Pages จะแสดงหน้านี้จาก URL ระดับใดก็ได้
        ทำให้ Relative Path ไปยัง assets/ ใช้ไม่ได้เสมอ
    -->
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background-color: #f5f7fa;
            color: #1b2434;
            font-family: "Prompt", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            font-weight: 300;
            line-height: 1.6;
            text-align: center;
        }

        .box {
            width: 100%;
            max-width: 420px;
            padding: 36px 24px;
            background-color: #ffffff;
            border: 1px solid #e4e9f0;
            border-radius: 18px;
            box-shadow: 0 2px 10px rgba(20, 32, 54, 0.05);
        }

        .code {
            font-size: 2.25rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #1f5fd0;
        }

        .title {
            margin: 6px 0 0;
            font-size: 1.0625rem;
            font-weight: 500;
        }

        .text {
            margin: 8px 0 24px;
            font-size: 0.9375rem;
            color: #6b7789;
        }

        .back {
            display: inline-block;
            min-height: 46px;
            padding: 12px 26px;
            border-radius: 12px;
            background-color: #1f5fd0;
            color: #ffffff;
            font-size: 0.9375rem;
            font-weight: 400;
            text-decoration: none;
            transition: background-color 180ms ease;
        }

        .back:hover { background-color: #184da9; }
        .back:focus-visible { outline: 2px solid #1f5fd0; outline-offset: 3px; }
    </style>
</head>
<body>
    <main class="box">
        <p class="code">404</p>
        <h1 class="title">ไม่พบหน้าที่ต้องการ</h1>
        <p class="text">ลิงก์อาจถูกเปลี่ยนหรือไม่มีอยู่แล้ว</p>
        <a class="back" id="backHome" href="/">กลับไปหน้าแรก</a>
    </main>

    <script>
        /*
            GitHub Pages แบบ Project Site อยู่ใต้ /<repo>/ จึงต้องชี้กลับให้ถูก
            ถ้ามี path ตั้งแต่ 2 ชั้นขึ้นไป (/<repo>/<ที่ไม่มีอยู่>) ให้กลับไปที่ /<repo>/
            กรณีอื่น (User/Org Site หรือ Custom Domain) ให้กลับไปที่ /
        */
        (function () {
            var parts = window.location.pathname.split("/").filter(Boolean);
            if (parts.length >= 2 && parts[0].indexOf(".") === -1) {
                document.getElementById("backHome").href = "/" + parts[0] + "/";
            }
        })();
    </script>
</body>
</html>
