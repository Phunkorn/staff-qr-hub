<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff QR Hub</title>
    <meta name="description" content="ศูนย์รวมลิงก์สำหรับพนักงาน">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4f6fa">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css?v=20261005-2">
</head>
<body>
    <div class="page">

        <header class="hero">
            <!--
                โลโก้องค์กร — เปลี่ยนไฟล์ได้ที่ src ด้านล่าง
                ขนาดกล่องถูกกำหนดไว้ใน style.css แล้ว (.hero__logo)
            -->
            <div class="hero__logo">
                <img src="assets/images/logos/Premiumcare - Logo 2.jpg"
                     alt="Premium Care" width="64" height="63" decoding="async">
            </div>


            <h1 class="hero__title">Premium Contract</h1>

            <p class="hero__subtitle">
                ศูนย์รวมช่องทางสำหรับพนักงาน<br>
                <span class="hero__hint">เลือกบริการหรือช่องทางที่ต้องการ</span>
            </p>
        </header>

        <main>
            <h2 class="sr-only">รายการเมนู</h2>

            <!-- Card ทั้งหมดถูก render ด้วย assets/js/app.js จากข้อมูลใน assets/js/links.js -->
            <ul class="card-grid" id="linkGrid" aria-label="เมนูลิงก์สำหรับพนักงาน"></ul>

            <p class="grid-fallback" id="gridFallback" hidden>
                ยังไม่มีเมนูที่ตั้งค่าไว้ กรุณาเพิ่มข้อมูลในไฟล์ assets/js/links.js
            </p>
        </main>


    </div>

<script src="assets/js/links.js?v=20261005-3"></script>
<script src="assets/js/app.js?v=20261005-3"></script>
</body>
</html>
